obsidian:
  vault_path: "~/Documents/FreshLit"  # any Markdown output folder; .env can override
  digest_folder: ""          # relative to vault_path ("" = root of that folder)

ingestion:
  lookback_days: 7
  timezone: "UTC"
  max_results_per_query: 200  # per OpenAlex/EPMC query (search results are relevance-sorted)
  # User-chosen keywords, topics, and Europe PMC opt-in live in research_profile.md.

api:
  request_timeout_seconds: 30
  max_pages: 50
  retry_backoff_seconds: 2

filtering:
  dedup_title_similarity: 0.92
  vector_threshold: 0.65     # floor for obvious junk; ranking does the real work
  max_llm_candidates: 40     # LLM-score only the top-N vector-ranked survivors
  llm_batch_size: 15         # papers scored per single LLM request
  score_cutoff: 7.0
  default_journal_weight: 1.0
  embedding_model: "allenai/specter2_base"
  embedding_device: "cpu"

llm:
  provider: "codex"
  model: "gpt-5.6-luna"
  timeout_seconds: 120
  workers: 3
  max_retries: 2
  # Legacy install fallback; `freshlit init` creates a portable .env override.
  codex_home: "~/Library/Application Support/FreshLit/codex-home"
  # Rollback-only gateway setting; used only when provider is "gateway".
  base_url: "https://opencode.ai/zen/go/v1"
