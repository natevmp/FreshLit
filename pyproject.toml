[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freshlit"
version = "0.2.0"
description = "Automated literature monitoring agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12",
  "instructor>=1.3",
  "tenacity>=8.2",
  "openai>=1.30",
  "openai-codex==0.147.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "sentence-transformers>=2.7",
  "jellyfish>=1.0",
  "python-dotenv>=1.0",
  "peft>=0.10",
]

[project.scripts]
freshlit = "freshlit.main:main"

[tool.setuptools.packages.find]
include = ["freshlit", "freshlit.*"]
